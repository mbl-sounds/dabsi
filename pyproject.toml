[tool.poetry]
name = "dabsi"
version = "0.1.0"
description = "Distributed adaptive blind SIMO identification (DABSI): simulation code and reference implementations."
authors = ["Matthias Blochberger <matthias.blochberger@posteo.at>"]
license = "GPL-3.0"
readme = "README.md"
packages = [{ include = "dbsi" }, { include = "lib" }]

[tool.poetry.dependencies]
python = ">=3.12,!=3.14.1,<3.15"
numpy = "==2.5.4"
scipy = "==1.18.1"
torch = "==2.14.1"
matplotlib = "==3.11.2"
pyroomacoustics = "==0.9.0"
polars = "==1.44.2"
networkx = "==3.7"
soundfile = "==0.13.1"
cython = "==3.3.0"
setuptools = "==80.9.0"
# transitive dependencies pinned to the cluster freeze; poetry would otherwise resolve newer versions
filelock = "==4.2.4"
fonttools = "==4.67.0"
packaging = "==25.0"
python-dateutil = "==3.0.0"
typing-extensions = "==4.15.0"
tzdata = "==2026.5"

[tool.poetry.group.dev.dependencies]
pytest = "==9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
