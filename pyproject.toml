[tool.poetry]
name = "dabsi"
version = "0.1.0"
description = "Distributed adaptive blind SIMO identification (DABSI): simulation code and reference implementations."
authors = ["Matthias Blochberger <matthias.blochberger@posteo.at>"]
license = "GPL-3.0"
readme = "README.md"
packages = [{ include = "dbsi" }, { include = "lib" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = ">=2.4.1,<3.0.0"
scipy = ">=1.11.1,<2.0.0"
torch = ">=2.9.1,<3.0.0"
matplotlib = ">=3.10.8,<4.0.0"
pyroomacoustics = ">=0.9.0,<0.10.0"
polars = "^1.37.1"
networkx = "^3.4"
soundfile = "^0.13.0"
cython = "^3.0"
setuptools = ">=68.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
